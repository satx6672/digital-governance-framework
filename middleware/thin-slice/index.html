  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DGF Parent Command</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-panel: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
      --danger: #f43f5e;
      --success: #10b981;
      --border-color: #334155;
    }
    
    html, body {
      width: 100%;
      max-width: 400px;
      margin: 0 auto !important;
      padding: 0 !important;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      box-sizing: border-box;
      overflow-x: hidden !important; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    *, *:before, *:after { box-sizing: inherit; }

    .container {
      padding: 24px;
      width: 100%;
    }

    .panel {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
      text-align: center;
    }

    .panel-header {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .panel-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* Monospace Token Input */
    .token-box {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-dark);
      color: var(--success);
      font-family: ui-monospace, monospace;
      font-size: 14px;
      margin-bottom: 20px;
      text-align: left;
    }
    
    .token-box:focus {
      outline: none;
      border-color: var(--accent-blue);
    }
    
    /* Segment Selector Row */
    .segment-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    
    .segment-select {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      outline: none;  
    }
    
    .segment-select:focus {
      border-color: var(--accent-blue);
    }
    
    .btn-new-segment {
      padding: 0 14px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
  
    .btn-new-segment:hover {
      color: var(--text-main);
      border-color: var(--text-main);
    }
  
    /* Blank-Slate Segment Builder Drawer */
    .segment-builder {
      display: none;
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 16px;
      text-align: left;
    }
  
    .builder-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      display: block;
    }
  
    .builder-input, .builder-tier {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-panel);
      color: var(--text-main);
      font-size: 13px;
      margin-bottom: 12px;
      outline: none;
    }
  
    .time-window-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
  
    .builder-actions {
      display: flex;
      gap: 8px;
    }

    /* Perfect Proportional Symmetry for Buttons */
    .ctrl-btn {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid var(--border-color);
    }
    .ctrl-btn:last-child { margin-bottom: 0; }

    /* Button States */
    .btn-outline {
      background-color: transparent;
      color: var(--text-muted);
    }
    .btn-outline:hover {
      border-color: var(--text-main);
      color: var(--text-main);
    }
    .btn-active-blue {
      background-color: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }
    .btn-active-danger {
      background-color: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    /* Modal Overlays */
    .modal {
      display: none;
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
      text-align: center;
    }
    
    .modal-highlight {
      font-family: ui-monospace, monospace;
      font-size: 24px;
      letter-spacing: 0.2em;
      color: var(--success);
      margin: 16px 0;
      padding: 12px;
      background: var(--bg-dark);
      border-radius: 6px;
      border: 1px dashed var(--border-color);
    }

    .feedback {
      text-align: center;
      font-size: 12px;
      margin-top: 12px;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="panel">
      <div class="panel-header">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        Parent Dashboard
      </div>
      <div class="panel-sub">Browser Control Unit</div>

      <div style="text-align: left; font-size: 10px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;">Child Device Token</div>
      <input type="text" id="child-id" class="token-box" placeholder="cont_xxxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false">

      <!-- Segment Selector & Trigger -->
      <div style="text-align: left; font-size: 10px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;">Operating Hours Segment</div>
      <div class="segment-row">
  	<select id="segment-select" class="segment-select">
          <option value="standard" data-tier="standard" data-label="Standard Mode">Standard Mode (Default)</option>
    	  <option value="degraded" data-tier="degraded" data-label="Degraded Mode">Degraded Mode (Default)</option>
        </select>
       	<button id="btn-toggle-builder" class="btn-new-segment">+ New Segment</button>
      </div>

      <!-- Collapsible Blank-Slate Segment Builder -->
      <div id="segment-builder" class="segment-builder">
  	<label class="builder-label">Segment Name</label>
	<input type="text" id="seg-name" class="builder-input" placeholder="e.g., Quiet Time, Reading Mode" autocomplete="off">

  	<label class="builder-label">Enforcement Tier</label>
  	<select id="seg-tier" class="builder-tier">
    	  <option value="degraded">Degraded Mode (Restricted + Edge Proxy)</option>
    	  <option value="standard">Standard Mode (Baseline Perimeter)</option>
    	  <option value="custom">Custom Mode (Scheduled / Mapped Hybrid)</option>
  	</select>

        <div class="time-window-grid">
          <div>
            <label class="builder-label">Start Time</label>
            <input type="time" id="seg-start" class="builder-input" style="margin-bottom: 0;">
          </div>
        <div>
          <label class="builder-label">End Time</label>
          <input type="time" id="seg-end" class="builder-input" style="margin-bottom: 0;">
        </div>
      </div>

      <div class="builder-actions">
        <button id="btn-save-segment" class="ctrl-btn btn-action-blue" style="padding: 10px; margin-bottom: 0; font-size: 13px;">Save Segment</button>
        <button id="btn-cancel-segment" class="ctrl-btn btn-outline-terminal" style="padding: 10px; margin-top: 0; margin-bottom: 0; font-size: 13px;">Cancel</button>
      </div>
    </div>

    <div class="control-block">
      <button id="btn-standard" class="ctrl-btn btn-outline">STANDARD ACCESS</button>
      <button id="btn-homework" class="ctrl-btn btn-outline">Engage Homework Mode</button>
      <button id="btn-audit" class="ctrl-btn btn-outline">Terminal: View Edge Audit Log</button>
    </div>
      
      <div id="api-feedback" class="feedback"></div>
    </div>

    <!-- OTP Display Modal (Shown only once upon engagement) -->
    <div id="modal-otp-display" class="modal" style="border-color: var(--success);">
      <div style="color: var(--success); font-weight: 600; margin-bottom: 8px;">Proxy Engaged</div>
      <div style="font-size: 13px; color: var(--text-muted);">Homework mode active. It will auto-terminate in 4 hours. Your emergency override OTP is:</div>
      <div id="otp-value-display" class="modal-highlight">829-104</div>
      <button id="btn-close-otp-display" class="ctrl-btn btn-outline">Acknowledge & Close</button>
    </div>

    <!-- OTP Input Modal (Shown when attempting to downgrade) -->
    <div id="modal-otp-input" class="modal" style="border-color: var(--danger);">
      <div style="color: var(--danger); font-weight: 600; margin-bottom: 8px;">Authorization Required</div>
      <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">Enter the active session OTP to override the proxy early.</div>
      <input type="text" id="input-override-otp" class="token-box" placeholder="000-000" maxlength="7" style="text-align: center; font-size: 20px; letter-spacing: 0.1em;">
      <button id="btn-submit-override" class="ctrl-btn btn-active-danger">Authorize Downgrade</button>
      <button id="btn-cancel-override" class="ctrl-btn btn-outline" style="border: none;">Abort</button>
    </div>
  </div>

  <script>
    const API_BASE = "https://digital-governance-framework.onrender.com";
    const DGF_API_KEY = "00e625db6549070e7198c9e24e42ef70";

    const inputChildId = document.getElementById('child-id');
    const btnStandard = document.getElementById('btn-standard');
    const btnHomework = document.getElementById('btn-homework');
    const feedback = document.getElementById('api-feedback');
    
    const modalOtpDisplay = document.getElementById('modal-otp-display');
    const otpValueDisplay = document.getElementById('otp-value-display');
    const modalOtpInput = document.getElementById('modal-otp-input');
    const inputOverrideOtp = document.getElementById('input-override-otp');

    let isCurrentlyDegraded = false;

    const segmentSelect = document.getElementById('segment-select');
    const btnToggleBuilder = document.getElementById('btn-toggle-builder');
    const segmentBuilder = document.getElementById('segment-builder');
    const btnSaveSegment = document.getElementById('btn-save-segment');
    const btnCancelSegment = document.getElementById('btn-cancel-segment');

    let activeSegmentLabel = "Standard Mode";
    let selectedSegmentLabel = "Degraded Mode";

    // Load saved custom segments from localStorage
    const savedSegments = JSON.parse(localStorage.getItem('dgf_custom_segments') || '[]');
    savedSegments.forEach(addSegmentOptionToDOM);

    function addSegmentOptionToDOM(seg) {
      const opt = document.createElement('option');
      opt.value = seg.id;
      opt.dataset.tier = seg.tier;
      opt.dataset.label = seg.name;
      opt.dataset.start = seg.start || '';
      opt.dataset.end = seg.end || '';
      const windowText = (seg.start && seg.end) ? ` (${seg.start} - ${seg.end})` : '';
      opt.innerText = `${seg.name}${windowText}`;
      segmentSelect.appendChild(opt);
    }

    // Toggle Blank-Slate Builder Drawer
    btnToggleBuilder.addEventListener('click', () => {
      const isHidden = segmentBuilder.style.display === 'none' || !segmentBuilder.style.display;
      segmentBuilder.style.display = isHidden ? 'block' : 'none';
    });

    btnCancelSegment.addEventListener('click', () => {
      segmentBuilder.style.display = 'none';
    });

    // Save New Segment
    btnSaveSegment.addEventListener('click', () => {
      const name = document.getElementById('seg-name').value.trim();
      const tier = document.getElementById('seg-tier').value;
      const start = document.getElementById('seg-start').value;
      const end = document.getElementById('seg-end').value;

    if (!name) return showFeedback("Segment name required.", "var(--danger)");

    const newSeg = { id: 'seg_' + Date.now(), name, tier, start, end };
    savedSegments.push(newSeg);
    localStorage.setItem('dgf_custom_segments', JSON.stringify(savedSegments));

    addSegmentOptionToDOM(newSeg);
    segmentSelect.value = newSeg.id;
    selectedSegmentLabel = newSeg.name;
    segmentBuilder.style.display = 'none';
    document.getElementById('seg-name').value = '';
    updateUI();
  });

  // Update Action Button Text When Dropdown Changes
  segmentSelect.addEventListener('change', () => {
    const selectedOpt = segmentSelect.options[segmentSelect.selectedIndex];
    selectedSegmentLabel = selectedOpt.dataset.label;
    updateUI();
  });

  // Updated Two-Button Visual State Machine
  function updateUI() {
    if (isCurrentlyDegraded) {
      btnStatus.className = "ctrl-btn btn-status-red";
      btnStatus.innerText = `${activeSegmentLabel} Engaged`;
      btnAction.innerText = "Engage Standard Mode";
      telemetryPanel.style.display = 'block';
    } else {
      btnStatus.className = "ctrl-btn btn-status-green";
      btnStatus.innerText = "Standard Mode Engaged";
      const targetLabel = selectedSegmentLabel === "Standard Mode" ? "Degraded Mode" : selectedSegmentLabel;
      btnAction.innerText = `Engage ${targetLabel}`;
      telemetryPanel.style.display = 'none';
    }
  }
    // Load saved token
    const savedToken = localStorage.getItem('dgf_child_token');
    if (savedToken) {
      inputChildId.value = savedToken;
      checkCurrentState(savedToken);
    }

    inputChildId.addEventListener('input', (e) => {
      if (e.target.value.startsWith('cont_')) checkCurrentState(e.target.value);
    });

    async function checkCurrentState(token) {
      // Mock logic for UI testing. Replace with your actual fetch.
      updateUI();
    }

    // -- ROUTING ACTIONS -- //

    // 1. Engage Homework Mode (Free Upgrade)
    btnHomework.addEventListener('click', async () => {
      const token = inputChildId.value.trim();
      if (!token) return showFeedback("Token required.", "var(--danger)");
      
      if (!isCurrentlyDegraded) {
        await executeStateChange(token, true);
      }
    });

    // 2. Request Standard Access (Sudo Downgrade)
    btnStandard.addEventListener('click', () => {
      if (isCurrentlyDegraded) {
        modalOtpInput.style.display = 'block';
        inputOverrideOtp.focus();
      }
    });

    // 3. Submit Override OTP
    document.getElementById('btn-submit-override').addEventListener('click', async () => {
      const token = inputChildId.value.trim();
      const otp = inputOverrideOtp.value.trim();
      if (otp.length < 6) return showFeedback("Invalid OTP format.", "var(--danger)");
      
      await executeStateChange(token, false, otp);
    });

    // 4. Cancel/Close Modals
    document.getElementById('btn-cancel-override').addEventListener('click', () => {
      modalOtpInput.style.display = 'none';
      inputOverrideOtp.value = '';
    });
    
    document.getElementById('btn-close-otp-display').addEventListener('click', () => {
      modalOtpDisplay.style.display = 'none';
    });

    // -- CORE ENGINE -- //
    async function executeStateChange(token, targetState, otp = null) {
      showFeedback("Transmitting...", "var(--text-muted)");
      
      try {
        const response = await fetch(`${API_BASE}/toggle-state`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${DGF_API_KEY}` },
          body: JSON.stringify({ continuity_ref: token, is_degraded: targetState, auth_otp: otp })
        });

        // Simulate success for UI testing
        // if (response.ok) { ... }
        
        isCurrentlyDegraded = targetState;
        updateUI();
        showFeedback("Command accepted by edge proxy.", "var(--success)");

        if (targetState === true) {
          // Homework Mode engaged - show the ephemeral OTP
          // In production, parse this from response.json().generated_otp
          otpValueDisplay.innerText = Math.floor(100000 + Math.random() * 900000).toString().replace(/(\d{3})(\d{3})/, '$1-$2');
          modalOtpDisplay.style.display = 'block';
        } else {
          // Standard Access restored - hide input modal
          modalOtpInput.style.display = 'none';
          inputOverrideOtp.value = '';
        }
      } catch (err) {
        showFeedback("Network error.", "var(--danger)");
      }
    }

    // -- VISUAL STATE MACHINE -- //
    function updateUI() {
      if (isCurrentlyDegraded) {
        btnStandard.className = "ctrl-btn btn-outline";
        btnHomework.className = "ctrl-btn btn-active-blue";
        btnHomework.innerText = "Homework Mode Active";
      } else {
        btnStandard.className = "ctrl-btn btn-active-blue";
        btnHomework.className = "ctrl-btn btn-outline";
        btnHomework.innerText = "Engage Homework Mode";
      }
    }

    function showFeedback(msg, color) {
      feedback.style.color = color;
      feedback.innerText = msg;
      setTimeout(() => feedback.innerText = "", 4000);
    }
  </script>
</body>
</html>
