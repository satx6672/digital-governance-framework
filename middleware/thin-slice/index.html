<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Parent Dashboard - Browser Control Unit</title>
  <style>
    :root {
      --bg-outer: #0b0f19;
      --bg-card: #161f30;
      --bg-input: #0d131f;
      --border-card: #233046;
      --border-inner: #2e3d52;
      --text-main: #f8fafc;
      --text-muted: #8b9bb4;
      --blue-btn: #3b82f6;
      --red-btn: #f43f5e;
      --toggle-track: #64748b;
    }

    *, *:before, *:after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-outer);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .bcu-wrapper {
      width: 100%;
      max-width: 400px;
      padding: 28px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Header */
    .header-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .header-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* Card Containers */
    .card {
      width: 100%;
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    /* Card 1: Device Token */
    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 10px;
    }

    .token-input {
      width: 100%;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      background-color: var(--bg-input);
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 15px;
      outline: none;
    }

    .token-input:focus {
      border-color: var(--blue-btn);
      color: var(--text-main);
    }

    /* Card 2: Single Action/Status Toggle Button & Telemetry */
    .btn-enforce {
      width: 100%;
      padding: 16px;
      border-radius: 8px;
      font-size: 19px;
      font-weight: 600;
      color: #ffffff;
      border: none;
      cursor: pointer;
      margin-bottom: 18px;
      transition: background-color 0.15s ease;
    }

    .btn-state-blue {
      background-color: var(--blue-btn);
    }

    .btn-state-red {
      background-color: var(--red-btn);
    }

    .telemetry-box {
      border: 1px solid var(--border-inner);
      border-radius: 8px;
      padding: 14px 16px;
    }

    .telemetry-title {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
    }

    .telemetry-grid {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .stat-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .stat-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      font-weight: 600;
    }

    .val-blue { color: #3b82f6; }
    .val-red { color: #f43f5e; }
    .val-white { color: #f8fafc; }

    /* Card 3: Mode Switches */
    .modes-card {
      padding: 8px 20px;
    }

    .mode-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-inner);
    }

    .mode-row:last-child {
      border-bottom: none;
    }

    .mode-label {
      font-size: 15px;
      font-weight: 600;
      color: #94a3b8;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--toggle-track);
      transition: 0.2s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: #ffffff;
      transition: 0.2s;
      border-radius: 50%;
    }

    .switch input:checked + .slider {
      background-color: var(--blue-btn);
    }

    .switch input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* Footer */
    .footer {
      font-size: 11px;
      color: #475569;
      margin-top: 4px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="bcu-wrapper">
    <!-- Header -->
    <div class="header-title">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      Parent Dashboard
    </div>
    <div class="header-sub">Browser Control Unit</div>

    <!-- Card 1: Device Token -->
    <div class="card">
      <div class="field-label">DEVICE TOKEN</div>
      <input type="text" id="device-token" class="token-input" placeholder="cont_xxxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false">
    </div>

    <!-- Card 2: Mode Switches -->
    <div class="card modes-card">
      <div class="mode-row">
        <span class="mode-label">Standard Mode</span>
        <label class="switch">
          <input type="checkbox" name="operating-mode" value="standard">
          <span class="slider"></span>
        </label>
      </div>
      <div class="mode-row">
        <span class="mode-label">Degraded Mode</span>
        <label class="switch">
          <input type="checkbox" name="operating-mode" value="degraded">
          <span class="slider"></span>
        </label>
      </div>
      <div class="mode-row">
        <span class="mode-label">Custom Mode</span>
        <label class="switch">
          <input type="checkbox" name="operating-mode" value="custom">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    
    <!-- Card 3: In-Place Action Button & Live Edge Telemetry -->
    <div class="card">
      <button id="btn-enforce" class="btn-enforce btn-state-blue">Enforce Operating Hours</button>

      <div class="telemetry-box">
        <div class="telemetry-title">LIVE EDGE TELEMETRY</div>
        <div class="telemetry-grid">
          <div class="stat-col">
            <div class="stat-label">PAYLOADS ISOLATED</div>
            <div id="metric-isolated" class="stat-val val-blue">0002</div>
          </div>
          <div class="stat-col">
            <div class="stat-label">TRACKERS BLOCKED</div>
            <div id="metric-blocked" class="stat-val val-red">0002</div>
          </div>
          <div class="stat-col">
            <div class="stat-label">DATA SAVED</div>
            <div id="metric-data" class="stat-val val-white">0.03 MB</div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">DGF Edge Node v1.0.0 • Local-First Security</div>
  </div>

  <script>
    const modeCheckboxes = document.querySelectorAll('input[name="operating-mode"]');
    const btnEnforce = document.getElementById('btn-enforce');
    let isEnforced = false;

    // Exclusive toggle behavior for the 3 mode switches
    modeCheckboxes.forEach(box => {
      box.addEventListener('change', () => {
        if (box.checked) {
          modeCheckboxes.forEach(other => {
            if (other !== box) other.checked = false;
          });
        }
      });
    });
    
    // Single button toggling in-place between Blue ("Enforce Operating Hours") and Red ("Operating Hours Enforced")
    btnEnforce.addEventListener('click', () => {
      isEnforced = !isEnforced;
      if (isEnforced) {
        btnEnforce.className = 'btn-enforce btn-state-red';
        btnEnforce.innerText = 'Operating Hours Enforced';
      } else {
        btnEnforce.className = 'btn-enforce btn-state-blue';
        btnEnforce.innerText = 'Enforce Operating Hours';
      }
    });
  </script>
</body>
</html>
