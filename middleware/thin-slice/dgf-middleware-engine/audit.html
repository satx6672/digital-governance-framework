<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DGF Edge Audit Log</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #050505;
      color: #34d399; /* Neon green */
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      height: 100vh;
      box-sizing: border-box;
      overflow-y: auto;
    }
    .header {
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 20px;
      position: sticky;
      top: 0;
      background-color: #050505;
      display: flex;
      justify-content: space-between;
    }
    .title { color: #60a5fa; font-weight: bold; }
    .status { color: #f43f5e; animation: pulse 2s infinite; }
    .log-entry {
      margin-bottom: 15px;
      padding: 10px;
      background-color: #111;
      border-left: 3px solid #3b82f6;
    }
    .timestamp { color: #94a3b8; font-size: 11px; }
    .threat { color: #f8fafc; word-break: break-all; }
    .harm-class { color: #fbbf24; }
    .action { color: #34d399; font-weight: bold; }
    
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚙️ DGF Middleware: LIVE EDGE AUDIT</div>
    <div class="status">● INTERCEPTION ENGINE ACTIVE</div>
  </div>
  <div id="terminal">
    <div class="log-entry">
      <div class="timestamp">System initialized... waiting for payload execution.</div>
    </div>
  </div>
  <script src="audit.js"></script>
</body>
</html>
